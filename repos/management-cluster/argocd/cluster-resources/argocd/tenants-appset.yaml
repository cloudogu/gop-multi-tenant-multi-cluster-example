apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: http://scmm.scm-manager.svc.cluster.local/scm/repo/argocd/tenants
        revision: HEAD
        files:
          - path: "*/tenant-values.yaml"
  template:
    metadata:
      name: tenant-{{.config.application.namePrefix}}
      labels:
        tenant: '{{.config.application.namePrefix}}'
    spec:
      project: argocd
      sources:
        - repoURL: ghcr.io/cloudogu
          chart: gop-helm
          targetRevision: 0.4.0
          helm:
            valueFiles:
              - $valuesRef/global-values.yaml
              - $valuesRef/{{ .path.path }}/tenant-values.yaml
        - repoURL: http://scmm.scm-manager.svc.cluster.local/scm/repo/argocd/tenants
          targetRevision: HEAD
          ref: valuesRef
      destination:
        server: '{{.apiServerUrl }}'
        namespace: gop
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          selfHeal: true
          prune: true

